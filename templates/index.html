<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Corujinha Ajuda</title>
    
    <!-- PWA -->
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
    <meta name="theme-color" content="#10a37f">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦉</text></svg>">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="overlay" id="overlay"></div>

    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <span class="logo">🦉</span>
            <h1>Corujinha Ajuda</h1>
        </div>
        <button class="new-chat-btn" id="newChatBtn"><span>＋</span> Nova conversa</button>
        <nav class="sidebar-nav">
            <button class="nav-item" id="historyBtn"><span>🕘</span> Histórico</button>
            <button class="nav-item" id="programmingBtn"><span>💻</span> Programação</button>
        </nav>
        <div class="sidebar-history" id="historyList"></div>
        <div class="sidebar-footer">
            <button class="nav-item" id="profileBtn"><span>👤</span> <span id="profileName">Meu perfil</span></button>
            <button class="nav-item" id="settingsBtn"><span>⚙️</span> Configurações</button>
        </div>
    </aside>

    <div class="main">
        <header class="topbar">
            <button class="menu-toggle" id="menuToggle">☰</button>
            <h2 id="chatTitle">Nova conversa</h2>
        </header>

        <div class="welcome-screen" id="welcomeScreen">
            <div class="welcome-logo">🦉</div>
            <h2 class="welcome-title">Olá, <span id="welcomeName">amigo(a)</span>!</h2>
            <p class="welcome-subtitle">Sou o Corujinha Ajuda. Como posso te ajudar hoje?</p>
            
            <div class="suggestions">
                <button class="suggestion-card" data-prompt="Me explique o que é inteligência artificial de forma simples.">
                    <span class="suggestion-icon">💡</span>
                    <span class="suggestion-text">O que é inteligência artificial?</span>
                </button>
                <button class="suggestion-card" data-prompt="Me ajude a escrever um e-mail profissional de apresentação.">
                    <span class="suggestion-icon">✍️</span>
                    <span class="suggestion-text">Escreva um e-mail profissional</span>
                </button>
                <button class="suggestion-card" data-prompt="Crie um exemplo de código em Python que lê um arquivo CSV e mostra as primeiras linhas.">
                    <span class="suggestion-icon">💻</span>
                    <span class="suggestion-text">Exemplo de código em Python</span>
                </button>
                <button class="suggestion-card" data-prompt="Me dê ideias criativas para um projeto de fim de semana.">
                    <span class="suggestion-icon">🎨</span>
                    <span class="suggestion-text">Ideias criativas para um projeto</span>
                </button>
            </div>

            <div class="model-selector">
                <label for="modelSelect">🤖 Modelo de IA:</label>
                <select id="modelSelect">
                    <option value="openai/gpt-oss-120b" selected>GPT-OSS 120B (Groq - Padrão)</option>
                    <option value="openai/gpt-oss-20b">GPT-OSS 20B (Groq - Rápido)</option>
                    <option value="qwen/qwen3.6-27b">Qwen 3.6 27B (Groq)</option>
                    <option value="openrouter/free">OpenRouter - Roteador Grátis</option>
                    <option value="deepseek/deepseek-r1:free">DeepSeek R1 (OpenRouter - Grátis)</option>
                    <option value="meta-llama/llama-3.3-70b-instruct:free">Llama 3.3 70B (OpenRouter - Grátis)</option>
                </select>
            </div>
        </div>

        <main class="chat-container" id="chat"></main>

        <footer class="input-area">
            <div id="attachmentPreview" class="attachment-preview" style="display: none;">
                <span id="attIcon">📄</span>
                <span id="attName">arquivo.pdf</span>
                <button id="removeAttBtn" title="Remover anexo">✕</button>
            </div>

            <div class="input-box">
                <button id="micBtn" type="button" aria-label="Entrada por voz" style="background: transparent; color: var(--text-muted); width: 36px; cursor: pointer; display: none;">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
                        <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                        <line x1="12" y1="19" x2="12" y2="23"></line>
                        <line x1="8" y1="23" x2="16" y2="23"></line>
                    </svg>
                </button>

                <button id="attachBtn" type="button" aria-label="Anexar arquivo" style="background: transparent; color: #10a37f; width: 36px; cursor: pointer;">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path>
                    </svg>
                </button>
                <input type="file" id="fileInput" accept=".pdf,.docx,.xlsx" style="display: none;">
                
                <textarea id="userInput" rows="1" placeholder="Pergunte alguma coisa..." autocomplete="off"></textarea>
                
                <button id="sendBtn" aria-label="Enviar mensagem">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="12" y1="19" x2="12" y2="5"></line>
                        <polyline points="5 12 12 5 19 12"></polyline>
                    </svg>
                </button>
            </div>
            <p class="input-hint">O Corujinha pode cometer erros. Verifique informações importantes.</p>
        </footer>
    </div>

    <div class="modal" id="profileModal">
        <div class="modal-content">
            <h3>👤 Meu Perfil</h3>
            <label for="userNameInput">Como você se chama?</label>
            <input type="text" id="userNameInput" placeholder="Digite seu nome">
            <div class="modal-actions">
                <button class="btn-secondary" data-close-modal>Cancelar</button>
                <button class="btn-primary" id="saveProfileBtn">Salvar</button>
            </div>
        </div>
    </div>

    <div class="modal" id="settingsModal">
        <div class="modal-content">
            <h3>⚙️ Configurações da IA</h3>
            <label for="promptInput">Prompt do sistema</label>
            <textarea id="promptInput" rows="8" placeholder="Descreva como a IA deve se comportar..."></textarea>
            <div class="modal-actions">
                <button class="btn-secondary" data-close-modal>Cancelar</button>
                <button class="btn-primary" id="savePromptBtn">Salvar prompt</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
    <script src="{{ url_for('static', filename='js/chat.js') }}"></script>
    
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/service-worker.js')
                .then(reg => console.log('Service Worker registrado!', reg))
                .catch(err => console.log('Falha ao registrar Service Worker', err));
        }
    </script>
</body>
</html>
